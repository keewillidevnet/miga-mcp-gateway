# Role -> OASF skill names, used by directory-search discovery routing.
#
# When MIGA_DISCOVERY_ROUTING is enabled, the gateway resolves a role's servers by
# searching the AGNTCY Directory for these skill names, mapping the matched OASF
# records back to registry servers via each record's annotations.miga_registry_ref.
# The static config/server-registry.yaml remains the default and the guaranteed
# fallback; this file only affects discovery-augmented routing.
#
# Skill names are the full hierarchical OASF paths used in oasf/records/*.record.json
# (OASF 1.0.0). This map was derived from the skills each record declares, grouped by
# the roles its server serves in config/server-registry.yaml. Keep it in sync if you
# change a record's skills or a server's roles.
# Validated on load against config/role-skills.schema.json.

