# MIGA — Docker Compose (local development / demo)
# Usage: docker compose up -d
#
# Post real-server migration: the platform layer is now REAL, external MCP servers
# that the gateway connects to as an MCP client (driven by config/server-registry.yaml).
# MIGA no longer ships home-grown platform server implementations — only INFER.
#
#   * remote_managed (ThousandEyes, Splunk) -> referenced by URL in the registry; NOT
#     compose services.
#   * docker_compose (Meraki, ISE, NetBox)  -> run as HTTP MCP services below, built
#     from their upstream repos.
#   * docker_image stdio (SD-WAN)           -> spawned on demand by the gateway via
#     `docker run -i catalyst-sdwan-mcp:latest` (gateway mounts the Docker socket).
#   * local_process stdio (Catalyst Center, ServiceNow) -> bundled into the gateway
#     image and spawned as stdio subprocesses (fastmcp run / python -m).
#   * INFER (MIGA-original)                  -> its own service, unchanged.

services:
  # ==========================================================================
  # Infrastructure
  # ==========================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - miga

  # ==========================================================================
  # AGNTCY Directory (REAL multi-service stack — replaces the former REST mock)
  # ==========================================================================
  # NOTE (not verified in CI / dev sandbox — no container-registry egress here):
  # image tags pinned to dir v1.3.0 (matches agntcy-dir SDK 1.3.0); zot v2.1.16 and
  # the postgres digest are lifted from the agntcy/dir quickstart compose. Confirm the
  # exact ghcr tags on a networked host (see VERIFY_DIRECTORY.md). Modeled on agntcy/dir
  # install/docker/docker-compose.yml + apiserver.env.
  #
  # `agntcy-directory` is the gRPC dir-apiserver on :8888 (the gateway connects
  # via AGNTCY_DIRECTORY_ADDR + dirctl). It stores OASF records as OCI artifacts
  # in zot and indexes them in postgres; the reconciler runs background sync.
  zot:
    image: ghcr.io/project-zot/zot:v2.1.16
    networks:
      - miga
    volumes:
      - zot-data:/var/lib/registry
    restart: unless-stopped

  dir-postgres:
    image: docker.io/bitnami/postgresql:latest@sha256:7651d7f24aad83fe68a222f7f20eded10d325c96ebee285ca5bf8162eddcba64
    environment:
      # env var names match the agntcy/dir quickstart compose (POSTGRES_*)
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=directory
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "directory"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - miga
    volumes:
      - dir-pg-data:/bitnami/postgresql
    restart: unless-stopped

  agntcy-directory:                      # gRPC dir-apiserver (host kept as agntcy-directory)
    image: ghcr.io/agntcy/dir-apiserver:v1.3.0
    depends_on:
      dir-postgres:
        condition: service_healthy
      zot:
        condition: service_started
    environment:
      - DIRECTORY_SERVER_LISTEN_ADDRESS=0.0.0.0:8888
      # Validate records against the OASF schema server. Records are pinned to
      # OASF 1.0.0; the schema server serves that version.
      - DIRECTORY_SERVER_OASF_API_VALIDATION_SCHEMA_URL=https://schema.oasf.outshift.com
      - DIRECTORY_SERVER_STORE_PROVIDER=oci
      - DIRECTORY_SERVER_STORE_OCI_REGISTRY_ADDRESS=zot:5000
      - DIRECTORY_SERVER_STORE_OCI_REPOSITORY_NAME=dir
      - DIRECTORY_SERVER_STORE_OCI_AUTH_CONFIG_INSECURE=true
      - DIRECTORY_SERVER_DATABASE_TYPE=postgres
      - DIRECTORY_SERVER_DATABASE_POSTGRES_HOST=dir-postgres
      - DIRECTORY_SERVER_DATABASE_POSTGRES_PORT=5432
      - DIRECTORY_SERVER_DATABASE_POSTGRES_DATABASE=directory
      - DIRECTORY_SERVER_DATABASE_POSTGRES_USERNAME=postgres
      - DIRECTORY_SERVER_DATABASE_POSTGRES_PASSWORD=postgres
      - DIRECTORY_SERVER_DATABASE_POSTGRES_SSL_MODE=disable
      - DIRECTORY_SERVER_ROUTING_LISTEN_ADDRESS=/ip4/0.0.0.0/tcp/8999
    ports:
      - "8888:8888"
    healthcheck:
      # dir-apiserver ships grpc-health-probe (NOT an HTTP /health endpoint).
      test: ["CMD", "grpc-health-probe", "-addr=127.0.0.1:8888"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - miga
    restart: unless-stopped

  dir-reconciler:
    image: ghcr.io/agntcy/dir-reconciler:v1.3.0
    depends_on:
      agntcy-directory:
        condition: service_started
      dir-postgres:
        condition: service_healthy
    environment:
      # Reconciler shares the store/database with the apiserver. Confirm the
      # reconciler.env keys from the dir quickstart on a live run.
      - DIRECTORY_SERVER_STORE_PROVIDER=oci
      - DIRECTORY_SERVER_STORE_OCI_REGISTRY_ADDRESS=zot:5000
      - DIRECTORY_SERVER_STORE_OCI_REPOSITORY_NAME=dir
      - DIRECTORY_SERVER_STORE_OCI_AUTH_CONFIG_INSECURE=true
      - DIRECTORY_SERVER_DATABASE_TYPE=postgres
      - DIRECTORY_SERVER_DATABASE_POSTGRES_HOST=dir-postgres
      - DIRECTORY_SERVER_DATABASE_POSTGRES_PORT=5432
      - DIRECTORY_SERVER_DATABASE_POSTGRES_DATABASE=directory
      - DIRECTORY_SERVER_DATABASE_POSTGRES_USERNAME=postgres
      - DIRECTORY_SERVER_DATABASE_POSTGRES_PASSWORD=postgres
      - DIRECTORY_SERVER_DATABASE_POSTGRES_SSL_MODE=disable
    networks:
      - miga
    restart: unless-stopped

  # ==========================================================================
  # Gateway (MCP client to all downstream servers)
  # ==========================================================================
  # The gateway bundles the stdio local_process servers (Catalyst Center via
  # `fastmcp run`, ServiceNow via `python -m servicenow_mcp.cli`) and spawns the
  # SD-WAN docker stdio image. It therefore mounts the Docker socket so it can run
  # `docker run -i catalyst-sdwan-mcp:latest` on demand.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    env_file: .env
    environment:
      - MIGA_GATEWAY_PORT=8000
      - MIGA_REDIS_URL=redis://redis:6379/0
      - AGNTCY_DIRECTORY_ADDR=agntcy-directory:8888  # gRPC dir-apiserver (agntcy-dir Python SDK)
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # SECURITY: mounting the Docker socket grants the gateway root-equivalent
      # control of the host. It is required only so the gateway can spawn the
      # SD-WAN stdio image via `docker run -i`. Harden in production by either
      # (a) running SD-WAN as a long-lived sidecar instead of socket-spawning, or
      # (b) fronting the socket with a restricted proxy (e.g. tecnativa/docker-socket-proxy
      # limited to container create/start), or (c) using rootless Docker. See MIGRATION.md.
      - /var/run/docker.sock:/var/run/docker.sock  # for SD-WAN `docker run -i`
    networks:
      - miga
    restart: unless-stopped

  # ==========================================================================
  # WebEx Bot (conversational interface — unchanged)
  # ==========================================================================
  webex-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: webex-bot
    env_file: .env
    environment:
      - WEBEX_BOT_PORT=9000
      - MIGA_GATEWAY_URL=http://gateway:8000
    ports:
      - "9000:9000"
    depends_on:
      - gateway
    networks:
      - miga
    restart: unless-stopped

  # ==========================================================================
  # Real external MCP servers (docker_compose deployment)
  # Build each from its upstream repo, then `docker compose up`.
  # ==========================================================================

  # Cisco Meraki — CiscoDevNet/meraki-magic-mcp-community (dynamic, StreamableHTTP)
  # Build: git clone https://github.com/CiscoDevNet/meraki-magic-mcp-community && docker build -t meraki-magic-mcp:latest .
  meraki-mcp:
    image: meraki-magic-mcp:latest
    env_file: .env
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_SERVER=dynamic        # uses meraki-mcp-dynamic.py
      - READ_ONLY_MODE=true
      - MERAKI_API_KEY=${MERAKI_API_KEY}
      - MERAKI_ORG_ID=${MERAKI_ORG_ID}
    ports:
      - "8000"
    networks:
      - miga
    restart: unless-stopped

  # Cisco ISE — pamosima/network-mcp-docker-suite (ise-mcp-server, StreamableHTTP)
  # Build: from the suite's ./ise-mcp-server build context.
  ise-mcp:
    image: network-mcp-ise:latest
    env_file: .env
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8005
      - ISE_HOST=${ISE_HOST}
      - ISE_USERNAME=${ISE_USERNAME}
      - ISE_PASSWORD=${ISE_PASSWORD}
      - ISE_VERIFY_SSL=${ISE_VERIFY_SSL:-true}
    ports:
      - "8005"
    networks:
      - miga
    restart: unless-stopped

  # NetBox — netboxlabs/netbox-mcp-server (read-only, StreamableHTTP)
  # Build: git clone https://github.com/netboxlabs/netbox-mcp-server && docker build -t netbox-mcp-server:latest .
  netbox-mcp:
    image: netbox-mcp-server:latest
    env_file: .env
    environment:
      - TRANSPORT=http
      - HOST=0.0.0.0
      - PORT=8000
      - NETBOX_URL=${NETBOX_URL}
      - NETBOX_TOKEN=${NETBOX_TOKEN}
    ports:
      - "8000"
    networks:
      - miga
    restart: unless-stopped

  # ==========================================================================
  # INFER — MIGA-original fusion engine (unchanged)
  # ==========================================================================
  infer-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: infer
    env_file: .env
    environment:
      - INFER_MCP_PORT=8007
      - MIGA_REDIS_URL=redis://redis:6379/0
      - AGNTCY_DIRECTORY_ADDR=agntcy-directory:8888  # gRPC dir-apiserver (agntcy-dir Python SDK)
    ports:
      - "8007:8007"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - infer-data:/data/infer
    networks:
      - miga
    restart: unless-stopped

# ==========================================================================
# Volumes & Networks
# ==========================================================================
volumes:
  redis-data:
  infer-data:
  zot-data:
  dir-pg-data:

networks:
  miga:
    driver: bridge
