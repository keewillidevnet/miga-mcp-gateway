# MIGA Helm Chart — Default Values
# Override with: helm install miga ./helm/miga -f my-values.yaml

global:
  image:
    registry: ""
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  env: production
  redis:
    url: redis://redis:6379/0

# ---------------------------------------------------------------------------
# Gateway
# ---------------------------------------------------------------------------
gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: miga/gateway
    tag: ""  # defaults to global.image.tag
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  ingress:
    enabled: true
    host: miga.example.com
    tls: true
    annotations:
      kubernetes.io/ingress.class: nginx

# ---------------------------------------------------------------------------
# WebEx Bot
# ---------------------------------------------------------------------------
webexBot:
  enabled: true
  replicaCount: 1
  image:
    repository: miga/webex-bot
    tag: ""
  port: 9000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# Platform Servers
# ---------------------------------------------------------------------------
# After the real-server migration, the platform layer is made of REAL, external
# MCP servers the gateway connects to as a client (see config/server-registry.yaml).
# They are NOT deployed as MIGA Helm Deployments. The only MIGA-built server is
# INFER, the cross-platform fusion engine. Provision external servers out-of-band
# and point the registry at their endpoints.
servers:
  infer:
    enabled: true
    replicaCount: 1
    port: 8007
    image:
      repository: miga/infer-mcp
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi

# ---------------------------------------------------------------------------
# Infrastructure
# ---------------------------------------------------------------------------
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  port: 6379
  persistence:
    enabled: true
    size: 1Gi

agntcyDirectory:
  enabled: true
  image:
    repository: ghcr.io/agntcy/directory
    tag: latest
  port: 8500

# ---------------------------------------------------------------------------
# Secrets (reference to K8s Secret)
# ---------------------------------------------------------------------------
secrets:
  name: miga-secrets
  # Create with:
  # kubectl create secret generic miga-secrets --from-env-file=.env -n miga

# ---------------------------------------------------------------------------
# Default server resources
# ---------------------------------------------------------------------------
defaultResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
