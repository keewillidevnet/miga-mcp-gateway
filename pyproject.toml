[project]
name = "miga"
version = "1.0.0"
description = "MCP Intelligence Gateway Architecture — Unified Cisco AI/ML Platform"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "Keenan Williams"}]
keywords = ["mcp", "cisco", "ai", "ml", "network", "automation", "agntcy"]

dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "redis[hiredis]>=5.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "click>=8.1.0",
    "aiohttp>=3.9.0",
    # MCP client used by the Webex bot to call the gateway (explicit, not via fastmcp).
    "mcp>=1.0.0",
    # AGNTCY Directory SDK — buf.build index (not PyPI), version 1.3.0 confirmed.
    # uv add agntcy-dir --index https://buf.build/gen/python . See VERIFY_DIRECTORY.md.
    "agntcy-dir==1.3.0",
]

[project.optional-dependencies]
infer = ["pandas>=2.1.0", "scipy>=1.11.0", "scikit-learn>=1.3.0"]
dev = ["ruff>=0.5.0", "pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0"]

[project.scripts]
miga-cli = "packages.cli.miga_cli:cli"

[tool.setuptools.packages.find]
include = ["miga_shared*", "packages*", "servers*"]

[tool.ruff]
target-version = "py311"
line-length = 100
# This migration lints/formats only the code it introduces or modifies. The files
# below are pre-existing internals the migration brief marks as do-not-touch; they
# are kept byte-identical to their prior state and excluded from ruff here (a
# dedicated lint-cleanup PR can remove these exclusions). See MIGRATION.md.
extend-exclude = [
    "servers/infer_mcp",
    "packages/webex_bot",
    "packages/cli",
    "miga_shared/auth",
    "miga_shared/clients",
    "miga_shared/errors.py",
    "miga_shared/models.py",
    "miga_shared/server_base.py",
    "miga_shared/utils",
]
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
# Intentionally kept: timezone.utc (broad runtime compatibility) and (str, Enum)
# mixins (stable str serialization relied on across services and tests).
ignore = ["UP017", "UP042"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
